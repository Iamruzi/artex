name: regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_TEST_PG_BASE: postgres://artex:artex@localhost:5432
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet -p 1 ./...
      - name: MCP transport race checks
        run: CGO_ENABLED=1 go test -race -p 1 ./mcphttp ./mcpguard
      - run: bash scripts/test-ci-isolated.sh
      - run: CGO_ENABLED=0 go build -p 1 ./cmd/artex

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      ARTEX_BUILD_CPUS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: NEXT_EXPORT=1 npx next build --webpack
